name: CI Trunk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      play_upload:
        description: "Upload AAB to Google Play (internal)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_test:
    name: Lint • Test • Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------
      # FLUTTER
      # ---------------------------
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      # Cache pub + dart tool artifacts for faster CI
      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore packages
        run: flutter pub get

      # NOTE: Backend contract generation / drift checks moved to kinly-backend.
      # This repo is a consumer of published contracts via submodule.
      - name: Verify submodules present
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive

      - name: Run guardrail checks (aggregated)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::guardrails"
          bash tool/guardrails.sh
          echo "::endgroup::"

      - name: Flutter analyze
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::flutter analyze"
          flutter analyze
          echo "::endgroup::"

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Flutter tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::flutter test"
          flutter test --coverage
          echo "::endgroup::"

      - name: Upload Flutter test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-failures
          path: |
            test/**/failures
            failures
          if-no-files-found: ignore
          retention-days: 3

      - name: Coverage summary (no enforcement)
        shell: bash
        run: |
          set -euo pipefail

          lcov --remove coverage/lcov.info \
            'lib/generated/*' 'lib/**/*.g.dart' 'lib/**/*.freezed.dart' 'lib/l10n/*' \
            'test/**' 'build/**' \
            --ignore-errors unused \
            -o coverage/filtered.info

          LINE_RATE=$(lcov --summary coverage/filtered.info | awk '/lines/ {print $2}' | tr -d '%')
          FLOOR=65
          echo "Coverage: ${LINE_RATE}% (floor ${FLOOR}%)"

          if [ "${LINE_RATE%.*}" -lt "$FLOOR" ]; then
            echo "::warning::Coverage ${LINE_RATE}% is below floor ${FLOOR}%"
          else
            echo "::notice::Coverage ${LINE_RATE}% meets or exceeds the floor"
          fi

  code_metrics:
    name: Codebase Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter deps
        run: flutter pub get

      - name: Install scc
        run: |
          curl -L https://github.com/boyter/scc/releases/latest/download/scc_Linux_x86_64.tar.gz -o scc.tar.gz
          tar -xzf scc.tar.gz
          sudo mv scc /usr/local/bin/scc

      - name: Run scc (summary)
        run: |
          scc . \
            --include-ext dart,sql,yaml,sh \
            --exclude-dir .git,build,.dart_tool,env \
            --no-cocomo \
            --ci

      - name: Run scc (JSON output)
        run: |
          scc . \
            --include-ext dart,sql,yaml,sh \
            --exclude-dir .git,build,.dart_tool,env \
            --no-cocomo \
            --format json \
            --output code_metrics.json

      - name: Print metrics summary from JSON
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          path = Path("code_metrics.json")
          if not path.exists():
            print("code_metrics.json not found")
            raise SystemExit(0)

          data = json.loads(path.read_text())

          if isinstance(data, dict) and "Languages" in data:
            languages = data["Languages"]
          elif isinstance(data, list):
            languages = data
          else:
            print("Unrecognized scc JSON structure:", type(data))
            print("Raw:", data)
            raise SystemExit(0)

          by_name = {}
          for lang in languages:
            name = lang.get("Name") or lang.get("name")
            if name:
              by_name[name] = lang

          def get_stat(lang_name):
            lang = by_name.get(lang_name)
            if not lang:
              return None
            code = lang.get("Code", lang.get("code", 0))
            files = lang.get("Count", lang.get("nFiles", 0))
            return int(code), int(files)

          print("== Code metrics summary (from code_metrics.json) ==")

          for name in ("Dart", "SQL", "YAML", "Shell"):
            stat = get_stat(name)
            if stat is None:
              print(f"{name}: no files")
            else:
              code, files = stat
              print(f"{name}: {code} lines of code across {files} files")

          total = by_name.get("Total") or by_name.get("SUM")
          if total:
            t_code = total.get("Code", total.get("code", 0))
            t_files = total.get("Count", total.get("nFiles", 0))
            print(f"Total: {int(t_code)} lines of code across {int(t_files)} files")
          PY

      - name: Complexity hotspots report
        run: dart run tool/report_complexity_hotspots.dart --out build/complexity_report.json --txt build/complexity_report.txt --baseline docs/engineering/complexity_baseline.json

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: |
            code_metrics.json
            build/complexity_report.json
            build/complexity_report.txt
          retention-days: 7

  android_dev_build:
    name: Android Dev (APK)
    needs: [lint_test]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images

          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Set Android SDK env + locate sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

          echo "SDK dir listing:"
          ls -la /usr/local/lib/android/sdk || true
          echo "cmdline-tools listing:"
          ls -la /usr/local/lib/android/sdk/cmdline-tools || true

          SDKMANAGER="$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under /usr/local/lib/android/sdk"
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Install Android NDK + CMake (pinned)
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --licenses >/dev/null <<<'y'
          "$SDKMANAGER" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Verify NDK clang exists
        shell: bash
        run: |
          set -euo pipefail
          echo "NDK home: $ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" || true

          if [ -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          elif [ -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x64/bin/clang" ]; then
            CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x64/bin/clang"
          else
            echo "::error::clang not found in NDK prebuilt bin"
            find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -maxdepth 3 -type f -name clang -print || true
            exit 1
          fi

          echo "Using clang: $CLANG"
          "$CLANG" --version

      - name: Install dependencies
        run: flutter pub get

      - name: Decode dev google-services.json
        run: |
          mkdir -p android/app/src/dev
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/src/dev/google-services.json

      - name: Flutter clean
        run: flutter clean

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/dev.json from secrets
        run: |
          mkdir -p env
          cat > env/dev.json <<'JSON'
          {
            "ENV": "dev",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "dev.example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}"
          }
          JSON

      - name: Setup debug signing (dev)
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          debugKeyAlias=${{ secrets.DEBUG_KEY_ALIAS }}
          debugKeyPassword=${{ secrets.DEBUG_KEY_PASSWORD }}
          debugStorePassword=${{ secrets.DEBUG_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/dev_keystore.jks

      - name: Diagnose Maven Central access
        shell: bash
        run: |
          set -euo pipefail
          env | grep -i proxy || true
          curl -I --retry 3 --retry-all-errors --connect-timeout 10 \
            https://repo.maven.apache.org/maven2/com/squareup/okio/okio-jvm/3.3.0/okio-jvm-3.3.0.jar || true
          curl -I --retry 3 --retry-all-errors --connect-timeout 10 \
            https://repo.maven.apache.org/maven2/ || true

      - name: Build dev APK (debug)
        run: |
          flutter build apk --debug \
            --flavor dev \
            -t lib/main.dart \
            --dart-define-from-file=env/dev.json \
            --build-number=$BUILD_NUMBER

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 3

  android_prod_release:
    name: Android Prod (AAB + Play)
    needs: [android_dev_build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
      IOS_STORE_URL: ${{ secrets.IOS_STORE_URL }}
      ANDROID_STORE_URL: ${{ secrets.ANDROID_STORE_URL }}
      REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      INVITE_HOST: ${{ secrets.INVITE_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve Play upload flag
        shell: bash
        run: |
          echo "DO_PLAY_UPLOAD=true" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images

          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Set Android SDK env + locate sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

          SDKMANAGER="$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under /usr/local/lib/android/sdk"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Install Android NDK + CMake (pinned)
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --licenses >/dev/null <<<'y'
          "$SDKMANAGER" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Verify NDK clang exists
        shell: bash
        run: |
          set -euo pipefail
          echo "NDK home: $ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" || true

          if [ -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          elif [ -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x64/bin/clang" ]; then
            CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x64/bin/clang"
          else
            echo "::error::clang not found in NDK prebuilt bin"
            find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -maxdepth 3 -type f -name clang -print || true
            exit 1
          fi

          echo "Using clang: $CLANG"
          "$CLANG" --version

      - name: Install dependencies
        run: flutter pub get

      - name: Decode prod google-services.json
        run: |
          mkdir -p android/app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/src/prod/google-services.json

      - name: Flutter clean
        run: flutter clean

      - name: Compute build number
        shell: bash
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/prod.json from secrets
        run: |
          mkdir -p env
          cat > env/prod.json <<'JSON'
          {
            "ENV": "prod",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}",
            "IOS_STORE_URL": "${{ env.IOS_STORE_URL }}",
            "ANDROID_STORE_URL": "${{ env.ANDROID_STORE_URL }}",
            "REVENUECAT_IOS_KEY": "${{ env.REVENUECAT_IOS_KEY }}",
            "REVENUECAT_ANDROID_KEY": "${{ env.REVENUECAT_ANDROID_KEY }}",
            "SENTRY_DSN": "${{ env.SENTRY_DSN }}",
            "INVITE_HOST": "${{ env.INVITE_HOST }}"
          }
          JSON

      - name: Setup release signing (prod)
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          prodKeyAlias=${{ secrets.PROD_KEY_ALIAS }}
          prodKeyPassword=${{ secrets.PROD_KEY_PASSWORD }}
          prodStorePassword=${{ secrets.PROD_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.PROD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/prod_keystore.jks

      - name: Build prod AAB (release)
        run: |
          flutter build appbundle --release \
            --flavor prod \
            -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --build-number=$BUILD_NUMBER

      - name: Upload Sentry Android native symbols (prod)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: dart run sentry_dart_plugin

      - name: Upload prod AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.aab
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 7

      - uses: ruby/setup-ruby@v1
        if: env.DO_PLAY_UPLOAD == 'true'
        with:
          ruby-version: '3.3.5'

      - name: Install Fastlane
        if: env.DO_PLAY_UPLOAD == 'true'
        run: gem install fastlane

      - name: Prepare Play Service Account
        if: env.DO_PLAY_UPLOAD == 'true'
        run: |
          mkdir -p config
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > config/google_play_key.json

      - name: Upload to Play (closed track)
        if: env.DO_PLAY_UPLOAD == 'true'
        run: fastlane android deploy_closed
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ github.workspace }}/config/google_play_key.json
          FASTLANE_SKIP_CONFIRMATIONS: true

      - name: Cleanup build outputs
        if: always()
        run: rm -rf build/app/outputs
