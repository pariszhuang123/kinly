name: CI Trunk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      play_upload:
        description: "Upload AAB to Google Play (internal)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    name: Lint • Test • Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Restore packages
        run: flutter pub get

      - name: Format check
        run: flutter format --set-exit-if-changed .

      - name: Lint
        run: dart analyze --fatal-infos

      - name: Tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Verify coverage gates
        run: python3 tool/verify_coverage.py --overall-min 95

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Summary
        run: |
          echo "✅ Lint/Format/Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "Coverage gated at 95%+" >> $GITHUB_STEP_SUMMARY

  supabase_dev:
    name: Supabase Migrations (Dev)
    needs: [lint_test]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Push migrations to Dev
        run: supabase db push

  android_dev_build:
    name: Android Dev (APK)
    needs: [lint_test, supabase_dev]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Compute build number
        id: versioning
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/dev.json from secrets
        run: |
          mkdir -p env
          cat > env/dev.json <<'JSON'
          {
            "ENV": "dev",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "dev.example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}"
          }
          JSON

      - name: Setup debug signing (dev)
        run: |
          mkdir -p android/app
          cat > android/app/key.properties <<EOF
          debugKeyAlias=${{ secrets.DEBUG_KEY_ALIAS }}
          debugKeyPassword=${{ secrets.DEBUG_KEY_PASSWORD }}
          debugStorePassword=${{ secrets.DEBUG_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/dev_keystore.jks

      - name: Build dev APK (debug)
        run: |
          flutter build apk --debug \
            --flavor dev \
            -t lib/main.dart \
            --dart-define-from-file=env/dev.json \
            --build-number=$BUILD_NUMBER

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk

  supabase_prod:
    name: Supabase Migrations (Prod)
    needs: [supabase_dev, android_dev_build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Push migrations to Prod
        run: supabase db push

  android_prod_release:
    name: Android Prod (AAB + Play)
    needs: [supabase_prod]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
      DO_PLAY_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.play_upload || vars.DO_PLAY_UPLOAD || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Compute build number
        id: versioning
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/prod.json from secrets
        run: |
          mkdir -p env
          cat > env/prod.json <<'JSON'
          {
            "ENV": "prod",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}"
          }
          JSON

      - name: Setup release signing (prod)
        run: |
          mkdir -p android/app
          cat > android/app/key.properties <<EOF
          prodKeyAlias=${{ secrets.PROD_KEY_ALIAS }}
          prodKeyPassword=${{ secrets.PROD_KEY_PASSWORD }}
          prodStorePassword=${{ secrets.PROD_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.PROD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/prod_keystore.jks

      - name: Build prod AAB (release)
        run: |
          flutter build appbundle --release \
            --flavor prod \
            -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --build-number=$BUILD_NUMBER

      - name: Upload prod AAB artifact (no Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.aab
          path: |
            build/app/outputs/bundle/**/*.aab

      - uses: ruby/setup-ruby@v1
        if: env.DO_PLAY_UPLOAD == 'true'
        with:
          ruby-version: '3.3.5'

      - name: Install Fastlane
        if: env.DO_PLAY_UPLOAD == 'true'
        run: gem install fastlane

      - name: Prepare Play Service Account
        if: env.DO_PLAY_UPLOAD == 'true'
        run: |
          mkdir -p config
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > config/google_play_key.json

      - name: Upload to Play (internal)
        if: env.DO_PLAY_UPLOAD == 'true'
        run: fastlane android deploy_internal
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: config/google_play_key.json
          FASTLANE_SKIP_CONFIRMATIONS: true

  # iOS builds are manual via Xcode; no CI job
