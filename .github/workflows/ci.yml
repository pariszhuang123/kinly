name: CI Trunk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      play_upload:
        description: "Upload AAB to Google Play (internal)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    name: Lint • Test • Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Restore packages
        run: flutter pub get

      - name: Generate contracts registry
        run: dart tool/contracts_extract.dart

      - name: Validate registry structure
        run: dart tool/validate_registry.dart docs/contracts/registry.json

      - name: Verify registry committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain docs/contracts/registry.json)" ]; then
            echo "::error::docs/contracts/registry.json is out of date. Run: dart tool/contracts_extract.dart";
            git --no-pager diff -- docs/contracts/registry.json || true;
            exit 1;
          fi

      - name: Check UI strings localized
        run: dart run tool/check_i18n.dart

      - name: Check shared enums grouped
        run: dart run tool/check_enums.dart

      - name: Check design system guardrails
        run: dart run tool/check_design_system.dart

      - name: Check directionality-safe layout
        run: dart run tool/check_directionality.dart

  code_metrics:
    name: Codebase Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install scc
        run: |
          curl -L https://github.com/boyter/scc/releases/latest/download/scc_Linux_x86_64.tar.gz -o scc.tar.gz
          tar -xzf scc.tar.gz
          sudo mv scc /usr/local/bin/scc

      - name: Run scc (summary)
        run: |
          scc . \
            --include-ext dart,sql,yaml,sh \
            --exclude-dir .git,build,.dart_tool,env \
            --no-cocomo \
            --ci

      - name: Run scc (JSON output)
        run: |
          scc . \
            --include-ext dart,sql,yaml,sh \
            --exclude-dir .git,build,.dart_tool,env \
            --no-cocomo \
            --format json \
            --output code_metrics.json

      - name: Print metrics summary from JSON
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          path = Path("code_metrics.json")
          if not path.exists():
            print("code_metrics.json not found")
            raise SystemExit(0)

          data = json.loads(path.read_text())

          if isinstance(data, dict) and "Languages" in data:
            languages = data["Languages"]
          elif isinstance(data, list):
            languages = data
          else:
            print("Unrecognized scc JSON structure:", type(data))
            print("Raw:", data)
            raise SystemExit(0)

          by_name = {}
          for lang in languages:
            name = lang.get("Name") or lang.get("name")
            if name:
              by_name[name] = lang

          def get_stat(lang_name):
            lang = by_name.get(lang_name)
            if not lang:
              return None
            code = lang.get("Code", lang.get("code", 0))
            files = lang.get("Count", lang.get("nFiles", 0))
            return int(code), int(files)

          print("== Code metrics summary (from code_metrics.json) ==")

          for name in ("Dart", "SQL", "YAML", "Shell"):
            stat = get_stat(name)
            if stat is None:
              print(f"{name}: no files")
            else:
              code, files = stat
              print(f"{name}: {code} lines of code across {files} files")

          total = by_name.get("Total") or by_name.get("SUM")
          if total:
            t_code = total.get("Code", total.get("code", 0))
            t_files = total.get("Count", total.get("nFiles", 0))
            print(f"Total: {int(t_code)} lines of code across {int(t_files)} files")
          PY

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: code_metrics.json

  contracts_drift:
    name: Contracts Drift (Local DB)
    needs: [lint_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changes
        shell: bash
        run: |
          git fetch --no-tags --prune --depth=200 origin +refs/heads/main:refs/remotes/origin/main
          BASE=$(if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "HEAD~1"; elif [ -n "${{ github.base_ref }}" ]; then echo "origin/${{ github.base_ref }}"; else echo "origin/main"; fi)
          echo "Comparing changes against $BASE"

          git diff --name-only "$BASE"...HEAD

          MATCHED=$(git diff --name-only "$BASE"...HEAD | grep -E '^supabase/(migrations|functions|policies|tests)/' || true)

          echo "DB-related changes:"
          echo "$MATCHED"

          if [ -n "$MATCHED" ]; then
            echo "do_db_check=true" >> $GITHUB_OUTPUT
          else
            echo "do_db_check=false" >> $GITHUB_OUTPUT
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.do_db_check == 'true'
        with:
          version: latest

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.do_db_check == 'true'
        with:
          channel: stable

      - name: Start local Supabase and reset DB
        if: steps.changes.outputs.do_db_check == 'true'
        run: |
          supabase start
          supabase db reset --yes

      - name: Wait for PostgREST
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -e
          for i in {1..60}; do
            if curl -s -H 'Accept: application/openapi+json' http://127.0.0.1:54321/rest/v1/ > /dev/null; then
              echo "PostgREST is up"; exit 0; fi; sleep 2; done
          echo "::error::PostgREST did not become ready"; exit 1

      - name: Install PostgreSQL client
        if: steps.changes.outputs.do_db_check == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pgTap suites
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PORT=$(awk -F'=' '/^\s*port\s*=/{gsub(/ /,"",$2); print $2; exit}' supabase/config.toml)
          PORT=${PORT:-54322}
          URI="postgresql://postgres:postgres@127.0.0.1:${PORT}/postgres"
          for file in supabase/tests/*.sql; do
            echo "::group::pgTap $file"
            psql "$URI" -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Regenerate contract snapshots (same as local)
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          chmod +x tool/contracts_regen.sh
          ./tool/contracts_regen.sh

      - name: Verify snapshots committed
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          CHANGED=$(git status --porcelain \
            docs/contracts/schema.sql \
            docs/contracts/rls_policies.sql \
            docs/contracts/openapi.json \
            docs/contracts/types.generated.ts \
            docs/contracts/edge_functions.json \
            docs/contracts/registry.json)
          if [ -n "$CHANGED" ]; then
            echo "::error::Contract snapshots are out of date. Commit updated schema/rls files.";
            git --no-pager diff -- \
              docs/contracts/schema.sql \
              docs/contracts/rls_policies.sql \
              docs/contracts/openapi.json \
              docs/contracts/types.generated.ts \
              docs/contracts/edge_functions.json \
              docs/contracts/registry.json || true;
            exit 1;
          fi

  supabase_dev:
    name: Supabase Migrations (Dev)
    needs: [lint_test, contracts_drift]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Set Supabase secrets (Dev – URL, service role, FCM)
        shell: bash
        run: |
          FCM_SA_JSON=$(echo "${{ secrets.FCM_SERVICE_ACCOUNT}}" | base64 --decode)

          supabase secrets set \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            FCM_SERVICE_ACCOUNT="$FCM_SA_JSON" \
            FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}"

      - name: Push migrations to Dev
        run: supabase db push

      - name: Deploy notifications_daily (Dev)
        run: |
          supabase functions deploy notifications_daily \
            --project-ref "$SUPABASE_PROJECT_ID" 

      - name: Smoke test notifications_daily (Dev)
        run: |
          supabase functions invoke notifications_daily \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

  android_dev_build:
    name: Android Dev (APK)
    needs: [lint_test, supabase_dev]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode dev google-services.json
        run: |
          mkdir -p android/app/src/dev
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | base64 --decode > android/app/src/dev/google-services.json

      - name: Flutter clean
        run: flutter clean

      - name: Compute build number
        id: versioning
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/dev.json from secrets
        run: |
          mkdir -p env
          cat > env/dev.json <<'JSON'
          {
            "ENV": "dev",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "dev.example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}"
          }
          JSON

      - name: Setup debug signing (dev)
        run: |
          mkdir -p android/app
          cat > android/app/key.properties <<EOF
          debugKeyAlias=${{ secrets.DEBUG_KEY_ALIAS }}
          debugKeyPassword=${{ secrets.DEBUG_KEY_PASSWORD }}
          debugStorePassword=${{ secrets.DEBUG_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/dev_keystore.jks

      - name: Build dev APK (debug)
        run: |
          flutter build apk --debug \
            --flavor dev \
            -t lib/main.dart \
            --dart-define-from-file=env/dev.json \
            --build-number=$BUILD_NUMBER

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk

  supabase_prod:
    name: Supabase Migrations (Prod)
    needs: [supabase_dev, android_dev_build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Set Supabase secrets (Prod – URL, service role, FCM)
        shell: bash
        run: |
          FCM_SA_JSON=$(echo "${{ secrets.FCM_SERVICE_ACCOUNT}}" | base64 --decode)

          supabase secrets set \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            FCM_SERVICE_ACCOUNT="$FCM_SA_JSON" \
            FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}"

      - name: Push migrations to Prod
        run: supabase db push

      - name: Deploy notifications_daily (Prod)
        run: |
          supabase functions deploy notifications_daily \
            --project-ref "$SUPABASE_PROJECT_ID" 

      - name: Smoke test notifications_daily (Prod)
        run: |
          supabase functions invoke notifications_daily \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

  android_prod_release:
    name: Android Prod (AAB + Play)
    needs: [supabase_prod]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Play upload flag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.play_upload }}" = "true" ]; then
            echo "DO_PLAY_UPLOAD=true" >> $GITHUB_ENV
          elif [ "${{ vars.DO_PLAY_UPLOAD }}" = "true" ]; then
            echo "DO_PLAY_UPLOAD=true" >> $GITHUB_ENV
          else
            echo "DO_PLAY_UPLOAD=false" >> $GITHUB_ENV
          fi

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode prod google-services.json
        run: |
          mkdir -p android/app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | base64 --decode > android/app/src/prod/google-services.json

      - name: Flutter clean
        run: flutter clean

      - name: Compute build number
        id: versioning
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV
        shell: bash

      - name: Create env/prod.json from secrets
        run: |
          mkdir -p env
          cat > env/prod.json <<'JSON'
          {
            "ENV": "prod",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}"
          }
          JSON

      - name: Setup release signing (prod)
        run: |
          mkdir -p android/app
          cat > android/app/key.properties <<EOF
          prodKeyAlias=${{ secrets.PROD_KEY_ALIAS }}
          prodKeyPassword=${{ secrets.PROD_KEY_PASSWORD }}
          prodStorePassword=${{ secrets.PROD_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.PROD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/prod_keystore.jks

      - name: Build prod AAB (release)
        run: |
          flutter build appbundle --release \
            --flavor prod \
            -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --build-number=$BUILD_NUMBER

      - name: Upload prod AAB artifact (no Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.aab
          path: |
            build/app/outputs/bundle/**/*.aab

      - uses: ruby/setup-ruby@v1
        if: env.DO_PLAY_UPLOAD == 'true'
        with:
          ruby-version: '3.3.5'

      - name: Install Fastlane
        if: env.DO_PLAY_UPLOAD == 'true'
        run: gem install fastlane

      - name: Prepare Play Service Account
        if: env.DO_PLAY_UPLOAD == 'true'
        run: |
          mkdir -p config
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > config/google_play_key.json

      - name: Upload to Play (internal)
        if: env.DO_PLAY_UPLOAD == 'true'
        run: fastlane android deploy_internal
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: config/google_play_key.json
          FASTLANE_SKIP_CONFIRMATIONS: true

  # iOS builds are manual via Xcode; no CI job
