name: CI Trunk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      play_upload:
        description: "Upload AAB to Google Play (internal)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    name: Lint • Test • Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------
      # ✅ DENO (Edge Functions)
      # ---------------------------
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version-file: .denoversion

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('.denoversion', 'deno.lock', 'supabase/deno.json') }}

      - name: "Guard: enforce pinned Deno version"
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(tr -d ' \t\r\n' < .denoversion)
          ACTUAL=$(deno --version | head -n 1 | awk '{print $2}')
          echo "Expected Deno: ${EXPECTED}"
          echo "Actual Deno:   ${ACTUAL}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Installed Deno ${ACTUAL} does not match pinned version ${EXPECTED}"
            exit 1
          fi

      - name: Deno tests (Supabase Edge Functions)
        shell: bash
        run: |
          set -euo pipefail
          deno test -A --config supabase/deno.json --lock=deno.lock --frozen supabase/functions || {
            echo "::error::Deno lockfile is out of date. Run locally:"
            echo "deno test -A --config supabase/deno.json --lock=deno.lock --frozen=false supabase/functions"
            echo "Then commit deno.lock."
            exit 1
          }

      # ---------------------------
      # FLUTTER
      # ---------------------------
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Restore packages
        run: flutter pub get

      - name: Generate contracts registry
        run: dart tool/contracts_extract.dart

      - name: Debug registry types
        run: |
          python - <<'PY'
          import json
          p="docs/contracts/registry.json"
          j=json.load(open(p,"r",encoding="utf-8"))
          d=j["domains"]["architecture_guardrails"]
          print("entities type:", type(d.get("entities")).__name__)
          print("entities value:", d.get("entities"))
          PY

      - name: Validate registry structure
        run: dart tool/validate_registry.dart docs/contracts/registry.json

      - name: Verify registry committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain docs/contracts/registry.json)" ]; then
            echo "::error::docs/contracts/registry.json is out of date. Run: dart tool/contracts_extract.dart";
            git --no-pager diff -- docs/contracts/registry.json || true;
            exit 1;
          fi

      - name: Run guardrail checks (aggregated)
        run: bash tool/guardrails.sh

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Flutter tests with coverage
        run: flutter test --coverage

      - name: Upload Flutter test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-failures
          path: |
            test/**/failures
            failures
          if-no-files-found: ignore
          retention-days: 3

      - name: Coverage summary (no enforcement)
        shell: bash
        run: |
          set -euo pipefail
          lcov --remove coverage/lcov.info \
            'lib/generated/*' 'lib/**/*.g.dart' 'lib/**/*.freezed.dart' 'lib/l10n/*' \
            'test/**' 'build/**' \
            --ignore-errors unused \
            -o coverage/filtered.info

          LINE_RATE=$(lcov --summary coverage/filtered.info | awk '/lines/ {print $2}' | tr -d '%')
          FLOOR=65
          echo "Coverage: ${LINE_RATE}% (floor ${FLOOR}%)"

          # Only emit a warning, do NOT fail the job
          if [ "${LINE_RATE%.*}" -lt "$FLOOR" ]; then
            echo "::warning::Coverage ${LINE_RATE}% is below floor ${FLOOR}%"
          else
            echo "::notice::Coverage ${LINE_RATE}% meets or exceeds the floor"
          fi

  code_metrics:
    name: Codebase Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Flutter SDK (includes Dart) so flutter_test "from sdk" resolves
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter deps
        run: flutter pub get

      - name: Install scc
        run: |
          curl -L https://github.com/boyter/scc/releases/latest/download/scc_Linux_x86_64.tar.gz -o scc.tar.gz
          tar -xzf scc.tar.gz
          sudo mv scc /usr/local/bin/scc

      - name: Run scc (summary)
        run: |
          scc . \
            --include-ext dart,sql,yaml,sh \
            --exclude-dir .git,build,.dart_tool,env \
            --no-cocomo \
            --ci

      - name: Run scc (JSON output)
        run: |
          scc . \
            --include-ext dart,sql,yaml,sh \
            --exclude-dir .git,build,.dart_tool,env \
            --no-cocomo \
            --format json \
            --output code_metrics.json

      - name: Print metrics summary from JSON
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          path = Path("code_metrics.json")
          if not path.exists():
            print("code_metrics.json not found")
            raise SystemExit(0)

          data = json.loads(path.read_text())

          if isinstance(data, dict) and "Languages" in data:
            languages = data["Languages"]
          elif isinstance(data, list):
            languages = data
          else:
            print("Unrecognized scc JSON structure:", type(data))
            print("Raw:", data)
            raise SystemExit(0)

          by_name = {}
          for lang in languages:
            name = lang.get("Name") or lang.get("name")
            if name:
              by_name[name] = lang

          def get_stat(lang_name):
            lang = by_name.get(lang_name)
            if not lang:
              return None
            code = lang.get("Code", lang.get("code", 0))
            files = lang.get("Count", lang.get("nFiles", 0))
            return int(code), int(files)

          print("== Code metrics summary (from code_metrics.json) ==")

          for name in ("Dart", "SQL", "YAML", "Shell"):
            stat = get_stat(name)
            if stat is None:
              print(f"{name}: no files")
            else:
              code, files = stat
              print(f"{name}: {code} lines of code across {files} files")

          total = by_name.get("Total") or by_name.get("SUM")
          if total:
            t_code = total.get("Code", total.get("code", 0))
            t_files = total.get("Count", total.get("nFiles", 0))
            print(f"Total: {int(t_code)} lines of code across {int(t_files)} files")
          PY

      - name: Complexity hotspots report
        run: dart run tool/report_complexity_hotspots.dart --out build/complexity_report.json --txt build/complexity_report.txt --baseline docs/engineering/complexity_baseline.json

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: |
            code_metrics.json
            build/complexity_report.json
            build/complexity_report.txt
          retention-days: 7

  contracts_drift:
    name: Contracts Drift (Local DB)
    needs: [lint_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=200 origin +refs/heads/main:refs/remotes/origin/main
          BASE=$(if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "HEAD~1"; elif [ -n "${{ github.base_ref }}" ]; then echo "origin/${{ github.base_ref }}"; else echo "origin/main"; fi)
          echo "Comparing changes against $BASE"

          git diff --name-only "$BASE"...HEAD

          MATCHED=$(git diff --name-only "$BASE"...HEAD | grep -E '^supabase/(migrations|functions|policies|tests)/' || true)

          echo "DB-related changes:"
          echo "$MATCHED"

          if [ -n "$MATCHED" ]; then
            echo "do_db_check=true" >> $GITHUB_OUTPUT
          else
            echo "do_db_check=false" >> $GITHUB_OUTPUT
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.do_db_check == 'true'
        with:
          version: latest

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.do_db_check == 'true'
        with:
          channel: stable

      - name: Start local Supabase and reset DB
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --yes

      - name: Wait for PostgREST
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Read [api].port from supabase/config.toml (fallback to Supabase default 54321)
          API_PORT=$(awk -F'=' '
            $0 ~ /^\[api\]/ {in_api=1; next}
            $0 ~ /^\[/ {in_api=0}
            in_api && $1 ~ /^[[:space:]]*port[[:space:]]*$/ {
              v=$2
              gsub(/[[:space:]]/,"",v)
              print v
              exit
            }
          ' supabase/config.toml)
          API_PORT=${API_PORT:-54321}

          echo "Waiting for PostgREST via API port: ${API_PORT}"

          for i in {1..60}; do
            if curl -s -H 'Accept: application/openapi+json' "http://127.0.0.1:${API_PORT}/rest/v1/" > /dev/null; then
              echo "PostgREST is up on ${API_PORT}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::PostgREST did not become ready on port ${API_PORT}"
          exit 1

      - name: Install PostgreSQL client
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pgTap suites
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Read [db].port from supabase/config.toml (fallback to Supabase default 54322)
          DB_PORT=$(awk -F'=' '
            $0 ~ /^\[db\]/ {in_db=1; next}
            $0 ~ /^\[/ {in_db=0}
            in_db && $1 ~ /^[[:space:]]*port[[:space:]]*$/ {
              v=$2
              gsub(/[[:space:]]/,"",v)
              print v
              exit
            }
          ' supabase/config.toml)
          DB_PORT=${DB_PORT:-54322}

          URI="postgresql://postgres:postgres@127.0.0.1:${DB_PORT}/postgres"
          echo "Using DB URI: $URI"

          for file in supabase/tests/*.sql; do
            echo "::group::pgTap $file"
            psql "$URI" -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Regenerate contract snapshots (same as local)
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tool/contracts_regen.sh
          ./tool/contracts_regen.sh

      - name: Verify snapshots committed
        if: steps.changes.outputs.do_db_check == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain \
            docs/contracts/schema.sql \
            docs/contracts/rls_policies.sql \
            docs/contracts/openapi.json \
            docs/contracts/types.generated.ts \
            docs/contracts/edge_functions.json \
            docs/contracts/registry.json)
          if [ -n "$CHANGED" ]; then
            echo "::error::Contract snapshots are out of date. Commit updated schema/rls files."
            git --no-pager diff -- \
              docs/contracts/schema.sql \
              docs/contracts/rls_policies.sql \
              docs/contracts/openapi.json \
              docs/contracts/types.generated.ts \
              docs/contracts/edge_functions.json \
              docs/contracts/registry.json || true
            exit 1
          fi

  supabase_dev:
    name: Supabase Migrations (Dev)
    needs: [lint_test, contracts_drift]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Set Supabase secrets (Dev — URL, service role, FCM)
        shell: bash
        run: |
          FCM_SA_JSON=$(echo "${{ secrets.FCM_SERVICE_ACCOUNT}}" | base64 --decode)

          supabase secrets set \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            RC_WEBHOOK_SECRET="${{ secrets.DEV_RC_WEBHOOK_SECRET }}" \
            FCM_SERVICE_ACCOUNT="$FCM_SA_JSON" \
            FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}"

      - name: Push migrations to Dev
        run: supabase db push

      - name: Deploy notifications_daily (Dev)
        run: |
          supabase functions deploy notifications_daily \
            --project-ref "$SUPABASE_PROJECT_ID" 

      - name: Smoke test notifications_daily (Dev)
        run: |
          supabase functions invoke notifications_daily

      - name: Deploy revenuecat_webhook (Dev)
        run: |
          supabase functions deploy revenuecat_webhook \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Smoke test revenuecat_webhook (Dev)
        continue-on-error: true
        run: |
          supabase functions invoke revenuecat_webhook
          
  android_dev_build:
    name: Android Dev (APK)
    needs: [lint_test, supabase_dev]
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          # Big SDKs and tools we don't need for Flutter Android build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Android emulator, system images, and (optionally) NDK
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true

          # Unused hosted toolcaches (if not used elsewhere)
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # docker images/containers
          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode dev google-services.json
        run: |
          mkdir -p android/app/src/dev
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | base64 --decode > android/app/src/dev/google-services.json

      - name: Flutter clean
        run: flutter clean

      - name: Compute build number
        id: versioning
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/dev.json from secrets
        run: |
          mkdir -p env
          cat > env/dev.json <<'JSON'
          {
            "ENV": "dev",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "dev.example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}"
          }
          JSON

      - name: Setup debug signing (dev)
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          debugKeyAlias=${{ secrets.DEBUG_KEY_ALIAS }}
          debugKeyPassword=${{ secrets.DEBUG_KEY_PASSWORD }}
          debugStorePassword=${{ secrets.DEBUG_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/dev_keystore.jks

      - name: Diagnose Maven Central access
        shell: bash
        run: |
          set -euo pipefail
          echo "Proxy env (if any):"
          env | grep -i proxy || true
          echo
          echo "HEAD okio-jvm jar:"
          curl -I --retry 3 --retry-all-errors --connect-timeout 10 \
            https://repo.maven.apache.org/maven2/com/squareup/okio/okio-jvm/3.3.0/okio-jvm-3.3.0.jar || true
          echo
          echo "HEAD Maven Central root:"
          curl -I --retry 3 --retry-all-errors --connect-timeout 10 \
            https://repo.maven.apache.org/maven2/ || true

      - name: Build dev APK (debug)
        run: |
          flutter build apk --debug \
            --flavor dev \
            -t lib/main.dart \
            --dart-define-from-file=env/dev.json \
            --build-number=$BUILD_NUMBER

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 3

  supabase_prod:
    name: Supabase Migrations (Prod)
    needs: [supabase_dev, android_dev_build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Set Supabase secrets (Prod — URL, service role, FCM)
        shell: bash
        run: |
          FCM_SA_JSON=$(echo "${{ secrets.FCM_SERVICE_ACCOUNT}}" | base64 --decode)

          supabase secrets set \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            RC_WEBHOOK_SECRET="${{ secrets.PROD_RC_WEBHOOK_SECRET }}" \
            FCM_SERVICE_ACCOUNT="$FCM_SA_JSON" \
            FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}"

      - name: Push migrations to Prod
        run: supabase db push

      - name: Deploy notifications_daily (Prod)
        run: |
          supabase functions deploy notifications_daily \
            --project-ref "$SUPABASE_PROJECT_ID" 

      - name: Smoke test notifications_daily (Prod)
        run: |
          supabase functions invoke notifications_daily

      - name: Deploy revenuecat_webhook (Prod)
        run: |
          supabase functions deploy revenuecat_webhook \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Smoke test revenuecat_webhook (Prod)
        continue-on-error: true
        run: |
          supabase functions invoke revenuecat_webhook
          
  android_prod_release:
    name: Android Prod (AAB + Play)
    needs: [supabase_prod]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
      IOS_STORE_URL: ${{ secrets.IOS_STORE_URL }}
      ANDROID_STORE_URL: ${{ secrets.ANDROID_STORE_URL }}
      REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      INVITE_HOST: ${{ secrets.INVITE_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Play upload flag
        shell: bash
        run: |
          # Always upload to Play for main builds
          echo "DO_PLAY_UPLOAD=true" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          # Big SDKs and tools we don't need for Flutter Android build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Android emulator, system images, and (optionally) NDK
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true

          # docker images/containers
          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode prod google-services.json
        run: |
          mkdir -p android/app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | base64 --decode > android/app/src/prod/google-services.json

      - name: Flutter clean
        run: flutter clean

      - name: Compute build number
        id: versioning
        shell: bash
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create env/prod.json from secrets
        run: |
          mkdir -p env
          cat > env/prod.json <<'JSON'
          {
            "ENV": "prod",
            "SUPABASE_URL": "${{ env.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ env.SUPABASE_ANON_KEY }}",
            "DEEPLINK_HOST": "example.com",
            "WEB_CLIENT_ID": "${{ env.WEB_CLIENT_ID }}",
            "IOS_CLIENT_ID": "${{ env.IOS_CLIENT_ID }}",
            "IOS_STORE_URL": "${{ env.IOS_STORE_URL }}",
            "ANDROID_STORE_URL": "${{ env.ANDROID_STORE_URL }}",
            "REVENUECAT_IOS_KEY": "${{ env.REVENUECAT_IOS_KEY }}",
            "REVENUECAT_ANDROID_KEY": "${{ env.REVENUECAT_ANDROID_KEY }}",
            "SENTRY_DSN": "${{ env.SENTRY_DSN }}",
            "INVITE_HOST": "${{ env.INVITE_HOST }}"
          }
          JSON

      - name: Setup release signing (prod)
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          prodKeyAlias=${{ secrets.PROD_KEY_ALIAS }}
          prodKeyPassword=${{ secrets.PROD_KEY_PASSWORD }}
          prodStorePassword=${{ secrets.PROD_STORE_PASSWORD }}
          storeType=JKS
          EOF
          echo "${{ secrets.PROD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/prod_keystore.jks

      - name: Diagnose Maven Central access
        shell: bash
        run: |
          set -euo pipefail
          echo "Proxy env (if any):"
          env | grep -i proxy || true
          echo
          echo "HEAD okio-jvm jar:"
          curl -I --retry 3 --retry-all-errors --connect-timeout 10 \
            https://repo.maven.apache.org/maven2/com/squareup/okio/okio-jvm/3.3.0/okio-jvm-3.3.0.jar || true
          echo
          echo "HEAD Maven Central root:"
          curl -I --retry 3 --retry-all-errors --connect-timeout 10 \
            https://repo.maven.apache.org/maven2/ || true

      - name: Build prod AAB (release)
        run: |
          flutter build appbundle --release \
            --flavor prod \
            -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --build-number=$BUILD_NUMBER

      - name: Upload Sentry Android native symbols (prod)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: dart run sentry_dart_plugin

      - name: Upload prod AAB artifact (no Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.aab
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 7

      - uses: ruby/setup-ruby@v1
        if: env.DO_PLAY_UPLOAD == 'true'
        with:
          ruby-version: '3.3.5'

      - name: Install Fastlane
        if: env.DO_PLAY_UPLOAD == 'true'
        run: gem install fastlane

      - name: Prepare Play Service Account
        if: env.DO_PLAY_UPLOAD == 'true'
        run: |
          mkdir -p config
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > config/google_play_key.json

      - name: Upload to Play (closed track)
        if: env.DO_PLAY_UPLOAD == 'true'
        run: fastlane android deploy_closed
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ github.workspace }}/config/google_play_key.json
          FASTLANE_SKIP_CONFIRMATIONS: true

      - name: Cleanup build outputs
        if: always()
        run: rm -rf build/app/outputs
