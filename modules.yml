version: 1
meta:
  description: Module ownership and kill-switch manifest (owner RPCs, orchestration, tables, flags).
  defaults:
    cross_module_fk_policy: nullable_set_null
    import_boundary: "only via each module's public_api dart entrypoint"
    orchestration_rule: "orchestration RPCs call owner RPCs only"

# Field schema (per module):
# - name: module id (slug)
# - owner_role: Planner|UI|BLoC|DB|Release|Test|Docs
# - status: foundational|feature|experimental
# - killable: true|false
# - kill_switch_flag: feature flag key or null if always on
# - plan_gates: list of entitlements that must enable this module
# - depends_on: modules that must be present/enabled
# - allowed_imports_from: modules that may import this module (use "*" to allow all)
# - public_api:
#     dart: path to the ONLY file allowed for cross-module imports (to be created)
# - data:
#     tables_owned: canonical table names owned by this module
#     cross_module_refs: optional references this module keeps to others (nullable/soft links only)
# - rpcs:
#     owner: canonical owner RPC names (mutations for owned tables)
#     orchestration: orchestration RPCs this module owns (explicit cross-module flows)
# - entrypoints:
#     routes: app routes/screens exposed by this module
#     deep_links: deep link patterns handled here
#     navigation_tiles: tiles/menu IDs that surface this module
# - test_matrix:
#     feature_flag_off: ensure tests cover flag-off behavior
#     plan_gate: ensure tests cover entitlement gating
# - notes: optional freeform context

modules:
  - name: core
    owner_role: Planner
    status: foundational
    killable: false
    kill_switch_flag: null
    plan_gates: []
    depends_on: []
    allowed_imports_from: ["*"]
    public_api:
      dart: null
    data:
      tables_owned:
        - homes
        - members
        - invites
      cross_module_refs: []
    rpcs:
      owner:
        - homes.create
        - homes.join
        - homes.transferOwner
        - homes.leave
        - invites.getOrCreate
        - invites.revoke
      orchestration: []
    entrypoints:
      routes:
        - /welcome
        - /join
        - /today
      deep_links:
        - /join/:code
      navigation_tiles:
        - home_hub
    test_matrix:
      feature_flag_off: false
      plan_gate: false
    notes: Foundational identities/homes/invites; other modules depend on this.

  - name: auth
    owner_role: Planner
    status: foundational
    killable: false
    kill_switch_flag: null
    plan_gates: []
    depends_on: [core]
    allowed_imports_from: ["*"]
    public_api:
      dart: null
    data:
      tables_owned: []
      cross_module_refs: []
    rpcs:
      owner:
        - auth.signInWithProvider
        - auth.signOut
      orchestration: []
    entrypoints:
      routes:
        - /welcome
      deep_links: []
      navigation_tiles: []
    test_matrix:
      feature_flag_off: false
      plan_gate: false
    notes: Supabase OAuth (Google/Apple); uses Core membership but owns no tables.

  - name: home_membership
    owner_role: Planner
    status: feature
    killable: false
    kill_switch_flag: null
    plan_gates: []
    depends_on: [core, auth]
    allowed_imports_from: ["core", "auth", "welcome", "hub", "today"]
    public_api:
      dart: null
    data:
      tables_owned:
        - home_membership_cache # placeholder for client cache if added
      cross_module_refs:
        - homes.id
        - invites.code
    rpcs:
      owner:
        - memberships.listActiveByHome
        - memberships.listByHome
      orchestration: []
    entrypoints:
      routes:
        - /join
        - /create-home
      deep_links:
        - /join/:code
      navigation_tiles:
        - join_home_cta
    test_matrix:
      feature_flag_off: true
      plan_gate: false
    notes: Wraps Core home/member RPCs for UI/BLoC; killable via feature flag.

  - name: welcome
    owner_role: UI
    status: feature
    killable: true
    kill_switch_flag: feature.welcome.enabled
    plan_gates: []
    depends_on: [auth, core]
    allowed_imports_from: ["hub", "today"]
    public_api:
